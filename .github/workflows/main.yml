name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: MijnAPK
          path: app/build/outputs/apk/debug/*.apk
